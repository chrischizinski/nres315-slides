<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="collective-interest-title collective-interest-desc">
<title id="collective-interest-title">Individual and collective influences on participation</title>
<desc id="collective-interest-desc">Individual costs and benefits, ability to act, and value of the shared outcome combine with collective factors: what others do and expect, discussions and professional support, and belief in the group’s ability. Both influence participation in collective action. A teaching summary of Chapter 8 section 8.4.2 and Box 8.4.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#123f5a"/></marker></defs>
<rect width="1200" height="560" fill="#fcfbf7"/>
<g font-family="Arial, sans-serif" fill="#1e2d36">
<rect x="25" y="50" width="460" height="310" rx="12" fill="#e0ebe0" stroke="#123f5a" stroke-width="3"/>
<text x="255.0" y="93" text-anchor="middle" font-size="33" font-weight="bold">
<tspan x="255.0" dy="0">Individual factors</tspan>
</text>
<text x="255.0" y="136" text-anchor="middle" font-size="25" font-weight="normal">
<tspan x="255.0" dy="0">My costs and benefits</tspan>
<tspan x="255.0" dy="35">My ability to act</tspan>
<tspan x="255.0" dy="35">Value of the shared outcome</tspan>
</text>
<rect x="715" y="50" width="460" height="310" rx="12" fill="#dbeaf0" stroke="#123f5a" stroke-width="3"/>
<text x="945.0" y="93" text-anchor="middle" font-size="33" font-weight="bold">
<tspan x="945.0" dy="0">Collective factors</tspan>
</text>
<text x="945.0" y="136" text-anchor="middle" font-size="25" font-weight="normal">
<tspan x="945.0" dy="0">What others do and expect</tspan>
<tspan x="945.0" dy="35">Discussion and support</tspan>
<tspan x="945.0" dy="35">Belief in the group’s ability</tspan>
</text>
<rect x="350" y="430" width="500" height="100" rx="12" fill="#e0ebe0" stroke="#123f5a" stroke-width="3"/>
<text x="600.0" y="473" text-anchor="middle" font-size="30" font-weight="bold">
<tspan x="600.0" dy="0">Participation in collective action</tspan>
</text>
<path d="M 255 360 V 402 L 347 475" fill="none" stroke="#123f5a" stroke-width="3.5" marker-end="url(#arrow)"/>
<path d="M 945 360 V 402 L 853 475" fill="none" stroke="#123f5a" stroke-width="3.5" marker-end="url(#arrow)"/>
<text x="255" y="304" text-anchor="middle" font-size="25" font-weight="normal">
<tspan x="255" dy="0">Individual efficacy: can I act?</tspan>
</text>
<text x="945" y="304" text-anchor="middle" font-size="25" font-weight="normal">
<tspan x="945" dy="0">Collective efficacy: can we succeed?</tspan>
</text>
</g>
</svg>

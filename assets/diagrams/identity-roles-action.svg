<svg xmlns="http://www.w3.org/2000/svg" width="900" height="660" viewBox="0 0 900 660" role="img" aria-labelledby="identity-roles-title identity-roles-desc">
  <title id="identity-roles-title">Roles contribute to identity and help shape action</title>
  <desc id="identity-roles-desc">One Cedar County resident occupies four roles: hunter, parent, commuter, and neighbor. Each role carries expectations. The meanings attached to those roles and the priorities among them contribute to identity, which helps shape what actions feel possible and appropriate in a particular setting. Roles do not determine action.</desc>
  <defs>
    <marker id="identity-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#123f5a"/>
    </marker>
  </defs>

  <rect width="900" height="660" rx="18" fill="#fcfbf7"/>

  <g font-family="Arial, sans-serif" fill="#1e2d36">
    <text x="450" y="42" text-anchor="middle" font-size="31" font-weight="700">One person occupies several roles</text>
    <text x="450" y="79" text-anchor="middle" font-size="24">Each role carries expectations.</text>

    <g font-size="28" font-weight="700" text-anchor="middle">
      <rect x="35" y="96" width="190" height="86" rx="14" fill="#e0ebe0" stroke="#2f6b57" stroke-width="3"/>
      <text x="130" y="150">Hunter</text>

      <rect x="248" y="96" width="190" height="86" rx="14" fill="#dbeaf0" stroke="#123f5a" stroke-width="3"/>
      <text x="343" y="150">Parent</text>

      <rect x="461" y="96" width="190" height="86" rx="14" fill="#e0ebe0" stroke="#2f6b57" stroke-width="3"/>
      <text x="556" y="150">Commuter</text>

      <rect x="674" y="96" width="190" height="86" rx="14" fill="#dbeaf0" stroke="#123f5a" stroke-width="3"/>
      <text x="769" y="150">Neighbor</text>
    </g>

    <path d="M 130 182 V 238 L 285 284" fill="none" stroke="#123f5a" stroke-width="3.5" marker-end="url(#identity-arrow)"/>
    <path d="M 343 182 V 238 L 390 284" fill="none" stroke="#123f5a" stroke-width="3.5" marker-end="url(#identity-arrow)"/>
    <path d="M 556 182 V 238 L 510 284" fill="none" stroke="#123f5a" stroke-width="3.5" marker-end="url(#identity-arrow)"/>
    <path d="M 769 182 V 238 L 615 284" fill="none" stroke="#123f5a" stroke-width="3.5" marker-end="url(#identity-arrow)"/>

    <rect x="190" y="285" width="520" height="132" rx="16" fill="#146778"/>
    <text x="450" y="329" text-anchor="middle" font-size="31" font-weight="700" fill="#ffffff">Identity</text>
    <text x="450" y="368" text-anchor="middle" font-size="25" fill="#ffffff">Meanings attached to roles</text>
    <text x="450" y="399" text-anchor="middle" font-size="23" fill="#ffffff">Priorities among roles in this setting</text>

    <path d="M 450 417 V 493" fill="none" stroke="#123f5a" stroke-width="4" marker-end="url(#identity-arrow)"/>
    <text x="475" y="462" font-size="23" font-weight="700">helps shape</text>

    <rect x="210" y="495" width="480" height="102" rx="16" fill="#dbeaf0" stroke="#123f5a" stroke-width="3"/>
    <text x="450" y="537" text-anchor="middle" font-size="28" font-weight="700">Action in context</text>
    <text x="450" y="572" text-anchor="middle" font-size="23">What feels possible and appropriate?</text>

    <text x="450" y="635" text-anchor="middle" font-size="21" font-style="italic">Roles influence action; they do not determine it.</text>
  </g>
</svg>

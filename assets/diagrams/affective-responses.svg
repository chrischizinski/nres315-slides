<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="affective-responses-title affective-responses-desc">
<title id="affective-responses-title">How emotions contribute to a response</title>
<desc id="affective-responses-desc">An event or encounter evokes an emotional response. That response involves feelings, physical responses, thoughts, and actions, and influences perception, judgment, and behavior, including which management options seem acceptable. This summarizes Chapter 8 section 8.4.4 rather than presenting a fitted causal model.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#123f5a"/></marker></defs>
<rect width="1200" height="560" fill="#fcfbf7"/>
<g font-family="Arial, sans-serif" fill="#1e2d36">
<rect x="15" y="55" width="270" height="132" rx="12" fill="#e0ebe0" stroke="#123f5a" stroke-width="3"/>
<text x="150.0" y="98" text-anchor="middle" font-size="32" font-weight="bold">
<tspan x="150.0" dy="0">Event or</tspan>
<tspan x="150.0" dy="34">encounter</tspan>
</text>
<rect x="375" y="55" width="360" height="132" rx="12" fill="#e0ebe0" stroke="#123f5a" stroke-width="3"/>
<text x="555.0" y="98" text-anchor="middle" font-size="32" font-weight="bold">
<tspan x="555.0" dy="0">Emotional</tspan>
<tspan x="555.0" dy="34">response</tspan>
</text>
<rect x="825" y="55" width="360" height="132" rx="12" fill="#dbeaf0" stroke="#123f5a" stroke-width="3"/>
<text x="1005.0" y="98" text-anchor="middle" font-size="30" font-weight="bold">
<tspan x="1005.0" dy="0">Perception, judgment,</tspan>
<tspan x="1005.0" dy="34">and behavior</tspan>
</text>
<path d="M 285 121 H 370" fill="none" stroke="#123f5a" stroke-width="3.5" marker-end="url(#arrow)"/>
<path d="M 735 121 H 820" fill="none" stroke="#123f5a" stroke-width="3.5" marker-end="url(#arrow)"/>
<rect x="35" y="300" width="245" height="85" rx="12" fill="#e0ebe0" stroke="#123f5a" stroke-width="3"/>
<text x="157.5" y="343" text-anchor="middle" font-size="25" font-weight="bold">
<tspan x="157.5" dy="0">Feelings</tspan>
</text>
<path d="M 555 187 V 240 H 157.5 V 296" fill="none" stroke="#123f5a" stroke-width="2.5"/>
<rect x="330" y="300" width="245" height="85" rx="12" fill="#e0ebe0" stroke="#123f5a" stroke-width="3"/>
<text x="452.5" y="343" text-anchor="middle" font-size="25" font-weight="bold">
<tspan x="452.5" dy="0">Physical responses</tspan>
</text>
<path d="M 555 187 V 240 H 452.5 V 296" fill="none" stroke="#123f5a" stroke-width="2.5"/>
<rect x="625" y="300" width="245" height="85" rx="12" fill="#e0ebe0" stroke="#123f5a" stroke-width="3"/>
<text x="747.5" y="343" text-anchor="middle" font-size="25" font-weight="bold">
<tspan x="747.5" dy="0">Thoughts</tspan>
</text>
<path d="M 555 187 V 240 H 747.5 V 296" fill="none" stroke="#123f5a" stroke-width="2.5"/>
<rect x="920" y="300" width="245" height="85" rx="12" fill="#e0ebe0" stroke="#123f5a" stroke-width="3"/>
<text x="1042.5" y="343" text-anchor="middle" font-size="25" font-weight="bold">
<tspan x="1042.5" dy="0">Actions</tspan>
</text>
<path d="M 555 187 V 240 H 1042.5 V 296" fill="none" stroke="#123f5a" stroke-width="2.5"/>
<text x="600" y="465" text-anchor="middle" font-size="28" font-weight="bold">
<tspan x="600" dy="0">Emotions can shape which management options seem acceptable.</tspan>
</text>
</g>
</svg>
